apiVersion: v1
kind: Namespace
metadata: {name: logging}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: fluentd-config, namespace: logging}
data:
  fluent.conf: |
    <system>
      log_level info
    </system>
    <source>
      @type tail
      @id nginx_container_logs
      path /var/log/containers/nginx-*_demo_nginx-*.log
      pos_file /state/nginx.pos
      path_key source_file
      tag nginx
      read_from_head true
      follow_inodes true
      refresh_interval 5
      <parse>
        @type regexp
        expression /^(?<cri_timestamp>[^ ]+) (?<stream>stdout|stderr) (?<flag>[^ ]+) (?<message>.*)$/
        time_key cri_timestamp
        time_format %Y-%m-%dT%H:%M:%S.%N%:z
        keep_time_key true
      </parse>
    </source>
    <filter nginx>
      @type record_transformer
      enable_ruby true
      <record>
        namespace demo
        pod ${File.basename(record['source_file']).split('_')[0]}
        node "#{ENV['NODE_NAME']}"
      </record>
    </filter>
    <match nginx>
      @type file
      path /collected/nginx
      append true
      <format>
        @type json
      </format>
      <buffer time>
        @type file
        path /state/buffer
        timekey 1h
        timekey_wait 0s
        flush_mode interval
        flush_interval 2s
        chunk_limit_size 1m
        total_limit_size 128m
        overflow_action block
      </buffer>
    </match>
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: fluentd, namespace: logging}
spec:
  selector:
    matchLabels: {app: fluentd}
  template:
    metadata:
      labels: {app: fluentd}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: fluentd
          image: fluent/fluentd:v1.18.0-debian-1.0
          command: [fluentd]
          args: ['-c', '/fluentd/etc/fluent.conf']
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          volumeMounts:
            - {name: config, mountPath: /fluentd/etc, readOnly: true}
            - {name: logs, mountPath: /var/log, readOnly: true}
            - {name: state, mountPath: /state}
            - {name: output, mountPath: /collected}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: fluentd-config}
        - name: logs
          hostPath: {path: /var/log, type: Directory}
        - name: state
          hostPath: {path: /var/lib/mts-devops/fluentd, type: DirectoryOrCreate}
        - name: output
          hostPath: {path: /var/lib/mts-devops/logs, type: DirectoryOrCreate}
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
